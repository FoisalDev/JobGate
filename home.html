<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobGate — Home</title>
    <link rel="stylesheet" href="home.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar">
      <!-- remove the `container` class here -->
      <div class="topbar-inner">
        <img src="./JobGate_logo.png" alt="JobGate" class="logo" />
    
        <div class="search-wrap" role="search">
          <iconify-icon icon="mdi:magnify" class="sicon" aria-hidden="true"></iconify-icon>
          <input type="text" placeholder="Search JobGate" aria-label="Search JobGate" />
        </div>
    
        <nav class="top-actions" aria-label="Top actions">
          <a href="#" class="tlink">Home</a>
          <a href="#" class="tlink">Profile</a>
          <img src="./avatar_placeholder.jpg" class="avatar" alt="User avatar" />
        </nav>
      </div>
    </header>
    
    

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <button class="sbtn active"><iconify-icon icon="mdi:home" class="sib"></iconify-icon>Feed</button>
        <button class="sbtn"><iconify-icon icon="mdi:lightbulb-on-outline" class="sib"></iconify-icon>Career Tips</button>
        <button class="sbtn"><iconify-icon icon="mdi:calendar-star" class="sib"></iconify-icon>Job Events</button>
        <button class="sbtn"><iconify-icon icon="mdi:book-open-variant" class="sib"></iconify-icon>Courses</button>
        <button class="sbtn"><iconify-icon icon="mdi:account-check-outline" class="sib"></iconify-icon>Skill Assessment</button>
        <button class="sbtn"><iconify-icon icon="mdi:briefcase-outline" class="sib"></iconify-icon>Jobs</button>
        <div class="spacer"></div>
        <button class="sbtn logout"><iconify-icon icon="mdi:logout" class="sib"></iconify-icon>Log out</button>
      </aside>

      <!-- Main feed -->
      <main class="content">
        <h2 class="section-title">Featured Jobs</h2>

        <!-- Job card 1 -->
        <article class="job-card" data-job-id="123">
          <div class="job-left"><div class="poster placeholder">Poster</div></div>
          <div class="job-right">
            <h3 class="job-title">[Job Title] — [Company]</h3>
            <div class="meta"><span>Location: [City, Country]</span> · <span>Type: Full-time</span></div>
            <div class="short-desc"><p>Short job description here…</p></div>

            <!-- এখানে সঠিক ফাইলে পাঠানো হলো -->
            <a class="view-details" href="featured_job_details.html?jobId=123" target="_blank">
              <iconify-icon icon="mdi:eye-outline"></iconify-icon> view details
            </a>
          </div>
        </article>

        <!-- Job card 2 -->
        <article class="job-card" data-job-id="456">
          <div class="job-left"><div class="poster placeholder">Poster</div></div>
          <div class="job-right">
            <h3 class="job-title">[Junior Software Engineer] — [Company]</h3>
            <div class="meta"><span>Location: [Dhaka]</span> · <span>Type: Entry-level</span></div>
            <div class="short-desc"><p>Another short description…</p></div>

            <!-- এখানেও সঠিক ফাইল -->
            <a class="view-details" href="featured_job_details.html?jobId=456" target="_blank">
              <iconify-icon icon="mdi:eye-outline"></iconify-icon> view details
            </a>
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
