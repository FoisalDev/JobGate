<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobGate — Event Details</title>
    <link rel="stylesheet" href="job_event_details.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <img src="./JobGate_logo.png" alt="JobGate" class="logo" />

        <div class="search-wrap" role="search">
          <iconify-icon
            icon="mdi:magnify"
            class="sicon"
            aria-hidden="true"
          ></iconify-icon>
          <input
            type="text"
            placeholder="Search JobGate"
            aria-label="Search JobGate"
          />
        </div>

        <nav class="top-actions" aria-label="Top actions">
          <a href="home.html" class="tlink">Home</a>
          <a href="#" class="tlink">Profile</a>
          <img
            src="./avatar_placeholder.jpg"
            class="avatar"
            alt="User avatar"
          />
        </nav>
      </div>
    </header>

    <main class="wrap">
      <!-- Back (opens same tab when navigated directly) -->
      <a
        class="back"
        href="job_events.html"
        onclick="if (history.length>1) { history.back(); return false; }"
      >
        <iconify-icon icon="mdi:arrow-left"></iconify-icon>
      </a>

      <h2 class="page-title">Events</h2>

      <section class="details-card">
        <div class="poster big">
          <div class="poster-ph">Event Poster</div>
        </div>

        <div class="desc">
          <h3 id="evTitle" class="ev-title">[Event Title]</h3>

          <div class="kv">
            <p><strong>Date:</strong> <span id="evDate">—</span></p>
            <p><strong>Organizer:</strong> <span id="evOrg">—</span></p>
            <p><strong>Location:</strong> <span id="evLoc">—</span></p>
          </div>

          <h4>Description</h4>
          <p id="evDesc" class="para">—</p>

          <h4>Highlights</h4>
          <ul id="evPoints" class="ulist"></ul>

          <h4>Apply</h4>
          <ul class="ulist">
            <li><strong>Deadline:</strong> <span id="evDeadline">—</span></li>
            <li>
              <strong>Application Link:</strong>
              <a id="evLink" href="#" target="_blank" rel="noopener"
                >Register Here</a
              >
            </li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      // Read ?eventId=...
      const id = new URLSearchParams(location.search).get("eventId");

      // Demo event data (replace with DB/API later)
      const EVENTS = {
        ev1: {
          title: "Yakima Development Association｜Job Fair 2025",
          date: "20–22 June 2025",
          org: "Yakima County Development Association",
          loc: "Yakima County",
          desc: "This three-day job fair brings together top companies, recruiters, and career coaches. Explore openings, attend sessions, and grow your network.",
          points: [
            "Booths from leading companies",
            "On-the-spot interviews & resume reviews",
            "Networking with HR professionals",
            "Exclusive career development sessions",
          ],
          deadline: "10 June 2025",
          link: "#",
        },
        ev2: {
          title: "UIU CODERS COMBAT 4.0",
          date: "July 2025",
          org: "UIU Computer Club",
          loc: "Dhaka",
          desc: "An exciting competition to challenge your problem-solving skills and connect with the community.",
          points: ["Algorithm rounds", "Team collaboration", "Tech talks"],
          deadline: "TBA",
          link: "#",
        },
        ev3: {
          title: "IEEE PES Day 2025 — UIU",
          date: "April 2025",
          org: "IEEE UIU Student Branch",
          loc: "UIU Campus",
          desc: "Talks and workshops on power & energy systems with experts and industry leaders.",
          points: ["Expert sessions", "Hands-on workshops", "Competitions"],
          deadline: "TBA",
          link: "#",
        },
        ev4: {
          title: "Campo wave 2025 — Online Internship Job Fair",
          date: "10–20 December 2025",
          org: "Career Expo",
          loc: "Online",
          desc: "Join from anywhere to meet companies, practice interviews, and get career guidance.",
          points: ["Mock interviews", "Career counseling", "Networking"],
          deadline: "5 December 2025",
          link: "#",
        },
      };

      const data = EVENTS[id] || {
        title: "[Event Title]",
        date: "—",
        org: "—",
        loc: "—",
        desc: "Full event description will appear here.",
        points: ["Point A", "Point B", "Point C"],
        deadline: "—",
        link: "#",
      };

      // Render
      evTitle.textContent = data.title;
      evDate.textContent = data.date;
      evOrg.textContent = data.org;
      evLoc.textContent = data.loc;
      evDesc.textContent = data.desc;
      evDeadline.textContent = data.deadline;
      evLink.href = data.link;

      const ul = document.getElementById("evPoints");
      ul.innerHTML = "";
      data.points.forEach((p) => {
        const li = document.createElement("li");
        li.textContent = p;
        ul.appendChild(li);
      });
    </script>
  </body>
</html>
