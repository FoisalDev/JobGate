<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobGate — Jobs</title>
    <link rel="stylesheet" href="jobs.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <img src="./JobGate_logo.png" alt="JobGate" class="logo" />
        <div class="search-wrap" role="search">
          <iconify-icon icon="mdi:magnify" class="sicon"></iconify-icon>
          <input type="text" placeholder="Search JobGate" />
        </div>
        <nav class="top-actions">
          <a href="home.html" class="tlink">Home</a>
          <a href="#" class="tlink">Profile</a>
          <img src="./avatar_placeholder.jpg" class="avatar" />
        </nav>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <button class="sbtn">
          <iconify-icon icon="mdi:home"></iconify-icon>Feed
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:lightbulb-on-outline"></iconify-icon>Career
          Tips
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:calendar-star"></iconify-icon>Job Events
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:book-open-variant"></iconify-icon>Courses
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:account-check-outline"></iconify-icon>Skill
          Assessment
        </button>
        <button class="sbtn active">
          <iconify-icon icon="mdi:briefcase-outline"></iconify-icon>Jobs
        </button>
        <div class="spacer"></div>
        <button class="sbtn logout">
          <iconify-icon icon="mdi:logout"></iconify-icon>Log out
        </button>
      </aside>

      <!-- Main -->
      <main class="content">
        <h1 class="page-title">Jobs</h1>

        <!-- Controls -->
        <div class="controls">
          <div class="range-wrap">
            <label
              >Filter by salary :
              <strong id="salaryLabel"
                >$<span id="salaryVal">20000</span></strong
              ></label
            >
            <input
              id="salaryInput"
              type="range"
              min="0"
              max="100000"
              step="5000"
              value="20000"
            />
          </div>

          <div class="filters">
            <label class="lbl">Filter By Job Type :</label>
            <select id="roleFilter" class="select">
              <option value="all" selected>All</option>
              <option value="software-engineer">Software Engineer</option>
              <option value="web-developer">Web Developer</option>
              <option value="qa-engineer">QA Engineer</option>
              <option value="computer-operator">Computer Operator</option>
            </select>
          </div>

          <div class="input chip-in">
            <iconify-icon icon="mdi:magnify"></iconify-icon>
            <input
              id="companySearch"
              type="text"
              placeholder="Search Company"
            />
          </div>
        </div>

        <!-- Jobs list -->
        <section id="jobsWrap" class="jobs"></section>
      </main>
    </div>

    <script>
      // ------- Demo data (replace with API later)
      const JOBS = [
        {
          id: "j1",
          role: "software-engineer",
          title: "Software Engineer",
          company: "Google",
          logo: "https://logo.clearbit.com/google.com",
          type: "Full Time",
          salary: 20000,
          deadline: "In a Month",
          skills: ["C++", "Java", "Python", "SQL"],
          desc: "Work on scalable systems and improve core products.",
        },
        {
          id: "j2",
          role: "software-engineer",
          title: "Senior Software Engineer",
          company: "Facebook",
          logo: "https://logo.clearbit.com/facebook.com",
          type: "Full Time",
          salary: 15000,
          deadline: "In 15 days",
          skills: ["C#", "Java", "Python", "SQL"],
          desc: "Build high-performance services powering social experiences.",
        },
        {
          id: "j3",
          role: "web-developer",
          title: "Front-End Web Developer",
          company: "Shopify",
          logo: "https://logo.clearbit.com/shopify.com",
          type: "Full Time",
          salary: 25000,
          deadline: "In 20 days",
          skills: ["HTML", "CSS", "JavaScript", "React"],
          desc: "Create delightful storefront experiences for merchants.",
        },
        {
          id: "j4",
          role: "qa-engineer",
          title: "QA Engineer",
          company: "Atlassian",
          logo: "https://logo.clearbit.com/atlassian.com",
          type: "Part Time",
          salary: 12000,
          deadline: "In 10 days",
          skills: ["Manual Testing", "Selenium", "JMeter"],
          desc: "Ensure product quality through automated & manual tests.",
        },
        {
          id: "j5",
          role: "computer-operator",
          title: "Computer Operator",
          company: "Local Bank",
          logo: "https://logo.clearbit.com/chase.com",
          type: "Full Time",
          salary: 8000,
          deadline: "In 7 days",
          skills: ["MS Office", "Data Entry", "Hardware basics"],
          desc: "Operate systems, maintain logs, assist branch operations.",
        },
      ];

      // ------- Elements
      const wrap = document.getElementById("jobsWrap");
      const roleSel = document.getElementById("roleFilter");
      const search = document.getElementById("companySearch");
      const salaryInput = document.getElementById("salaryInput");
      const salaryVal = document.getElementById("salaryVal");
      const salaryLabel = document.getElementById("salaryLabel");

      function fmtMoney(n) {
        return n.toLocaleString();
      }

      function render() {
        const role = roleSel.value;
        const q = (search.value || "").toLowerCase().trim();
        const sMin = Number(salaryInput.value);

        salaryVal.textContent = fmtMoney(sMin);

        const filtered = JOBS.filter((j) => {
          const byRole = role === "all" || j.role === role;
          const byCompany = !q || j.company.toLowerCase().includes(q);
          const bySalary = j.salary >= sMin;
          return byRole && byCompany && bySalary;
        });

        wrap.innerHTML = filtered.map(cardTpl).join("");
      }

      function pills(arr) {
        return arr.map((sk) => `<span class="pill">${sk}</span>`).join("");
      }

      function cardTpl(j) {
        return `
          <article class="job-card">
            <div class="job-left">
              <img class="logoimg" src="${j.logo}" alt="${
          j.company
        }" onerror="this.style.display='none'"/>
            </div>
            <div class="job-body">
              <h3 class="job-title">${j.title}</h3>
              <p class="company">${j.company}</p>

              <ul class="meta">
                <li><iconify-icon icon="mdi:check-circle-outline"></iconify-icon>${
                  j.type
                }</li>
                <li><iconify-icon icon="mdi:cash"></iconify-icon>$${fmtMoney(
                  j.salary
                )}</li>
                <li><iconify-icon icon="mdi:calendar-clock"></iconify-icon>Deadline : ${
                  j.deadline
                }</li>
                <li class="skills"><iconify-icon icon="mdi:briefcase-account"></iconify-icon>Required Skills: ${pills(
                  j.skills
                )}</li>
              </ul>

              <div class="cta">
                <a class="btn-apply" href="#" onclick="alert('Hook to Apply for ${
                  j.id
                }');return false;">Apply</a>
                <a class="btn-ghost" href="job_details.html?jobId=${
                  j.id
                }" target="_blank">See Details</a>
              </div>
            </div>
          </article>
        `;
      }

      // events
      roleSel.addEventListener("change", render);
      search.addEventListener("input", render);
      salaryInput.addEventListener("input", () => {
        salaryLabel.querySelector("span").textContent = fmtMoney(
          Number(salaryInput.value)
        );
        render();
      });

      // initial paint
      render();
    </script>
  </body>
</html>
