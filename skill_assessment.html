<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobGate — Skill Assessment</title>
    <link rel="stylesheet" href="skill_assessment.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <img src="./JobGate_logo.png" alt="JobGate" class="logo" />
        <div class="search-wrap" role="search">
          <iconify-icon icon="mdi:magnify" class="sicon"></iconify-icon>
          <input id="globalSearch" type="text" placeholder="Search JobGate" />
        </div>
        <nav class="top-actions">
          <a href="home.html" class="tlink">Home</a>
          <a href="#" class="tlink">Profile</a>
          <img src="./avatar_placeholder.jpg" class="avatar" />
        </nav>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <button class="sbtn">
          <iconify-icon icon="mdi:home"></iconify-icon>Feed
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:lightbulb-on-outline"></iconify-icon>Career
          Tips
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:calendar-star"></iconify-icon>Job Events
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:book-open-variant"></iconify-icon>Courses
        </button>
        <button class="sbtn active">
          <iconify-icon icon="mdi:account-check-outline"></iconify-icon>Skill
          Assessment
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:briefcase-outline"></iconify-icon>Jobs
        </button>
        <div class="spacer"></div>
        <button class="sbtn logout">
          <iconify-icon icon="mdi:logout"></iconify-icon>Log out
        </button>
      </aside>

      <!-- Main -->
      <main class="content">
        <div class="page-head">
          <a
            class="back"
            href="home.html"
            onclick="if(history.length>1){history.back();return false;}"
          >
            <iconify-icon icon="mdi:arrow-left"></iconify-icon>
          </a>
          <h1 class="page-title">Skill Assessment</h1>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <a
            href="#"
            class="btn-success"
            onclick="alert('Connect to your Apply flow');return false;"
          >
            <iconify-icon icon="mdi:plus-circle-outline"></iconify-icon> Apply
            For Test
          </a>

          <div class="filters">
            <label class="lbl">Filter By Job Type :</label>
            <select id="typeFilter" class="select">
              <option value="all" selected>All</option>
              <option value="programming">Programming</option>
              <option value="testing">Testing</option>
              <option value="sql">SQL</option>
            </select>
          </div>

          <div class="input chip-in">
            <iconify-icon icon="mdi:magnify"></iconify-icon>
            <input
              id="searchBox"
              type="text"
              placeholder="Search by keyword or title..."
            />
          </div>
        </div>

        <p class="hint" id="hintTxt">Displaying all assessments</p>

        <!-- List -->
        <section id="cardsWrap" class="cards"></section>
      </main>
    </div>

    <script>
      // ---- Demo data (replace with DB/API later)
      const TESTS = [
        {
          id: "t1",
          type: "programming",
          title: "Programming",
          tagline: "Test basic coding & problem-solving skills",
          time: 30,
          pass: "80%",
          questions: 20,
          attempts: 0,
          topics: [
            "Data types & control flow",
            "Functions & OOP basics",
            "Problem solving patterns",
          ],
        },
        {
          id: "t2",
          type: "testing",
          title: "Software Testing",
          tagline: "Manual & automated testing concepts",
          time: 30,
          pass: "80%",
          questions: 20,
          attempts: 0,
          topics: [
            "SDLC & STLC",
            "Test levels & types",
            "Bug lifecycle",
            "Intro to Selenium",
          ],
        },
        {
          id: "t3",
          type: "sql",
          title: "SQL",
          tagline: "Assess your database query skills",
          time: 30,
          pass: "80%",
          questions: 20,
          attempts: 0,
          topics: [
            "SELECT/JOIN/GROUP BY",
            "Subqueries",
            "Indexes & performance",
          ],
        },
      ];

      const wrap = document.getElementById("cardsWrap");
      const typeSel = document.getElementById("typeFilter");
      const searchBox = document.getElementById("searchBox");
      const hintTxt = document.getElementById("hintTxt");

      function paint() {
        const t = typeSel.value;
        const q = (searchBox.value || "").toLowerCase().trim();

        const filtered = TESTS.filter((x) => {
          const matchType = t === "all" || x.type === t;
          const hay = (
            x.title +
            " " +
            x.tagline +
            " " +
            x.topics.join(" ")
          ).toLowerCase();
          const matchQ = !q || hay.includes(q);
          return matchType && matchQ;
        });

        // hint text
        const label = t === "all" ? "all assessments" : `${t} assessments`;
        hintTxt.textContent = q
          ? `Filtering ${label} by “${q}”`
          : `Displaying ${label}`;

        // render
        wrap.innerHTML = filtered.map(cardTpl).join("");
      }

      function cardTpl(x) {
        return `
          <article class="card">
            <header class="card-h">
              <h3 class="title">${x.title}</h3>
              <div class="actions">
                <button class="iconbtn" title="Edit" onclick="alert('Hook edit for ${
                  x.id
                }')">
                  <iconify-icon icon="mdi:square-edit-outline"></iconify-icon>
                </button>
                <button class="iconbtn" title="Delete" onclick="alert('Hook delete for ${
                  x.id
                }')">
                  <iconify-icon icon="mdi:trash-can-outline"></iconify-icon>
                </button>
              </div>
            </header>

            <a class="tagline" href="#" onclick="return false;">${x.tagline}</a>

            <dl class="meta">
              <div><dt>Time</dt><dd>${x.time} minutes</dd></div>
              <div><dt>Passing Score</dt><dd>${x.pass}</dd></div>
              <div><dt>Number of Questions</dt><dd>${x.questions}</dd></div>
              <div><dt>Allowed Attempts</dt><dd>${x.attempts}</dd></div>
            </dl>

            <div class="topics">
              <span>Topics:</span>
              <ul>
                ${x.topics.map((t) => `<li>${t}</li>`).join("")}
              </ul>
            </div>

            <div class="cta-row">
              <a class="btn-primary" href="skill_exam.html?testId=${
                x.id
              }" target="_blank">Attempt Exam</a>
            </div>
          </article>
        `;
      }

      // listeners
      typeSel.addEventListener("change", paint);
      searchBox.addEventListener("input", paint);

      // first paint
      paint();
    </script>
  </body>
</html>
