<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobGate — Attempt Exam</title>
    <link rel="stylesheet" href="skill_exam.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-inner">
        <img src="./JobGate_logo.png" alt="JobGate" class="logo" />
        <div class="search-wrap" role="search">
          <iconify-icon icon="mdi:magnify" class="sicon"></iconify-icon>
          <input type="text" placeholder="Search JobGate" />
        </div>
        <nav class="top-actions">
          <a href="home.html" class="tlink">Home</a>
          <a href="#" class="tlink">Profile</a>
          <img src="./avatar_placeholder.jpg" class="avatar" />
        </nav>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <button class="sbtn">
          <iconify-icon icon="mdi:home"></iconify-icon>Feed
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:lightbulb-on-outline"></iconify-icon>Career
          Tips
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:calendar-star"></iconify-icon>Job Events
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:book-open-variant"></iconify-icon>Courses
        </button>
        <button class="sbtn active">
          <iconify-icon icon="mdi:account-check-outline"></iconify-icon>Skill
          Assessment
        </button>
        <button class="sbtn">
          <iconify-icon icon="mdi:briefcase-outline"></iconify-icon>Jobs
        </button>
        <div class="spacer"></div>
        <button class="sbtn logout">
          <iconify-icon icon="mdi:logout"></iconify-icon>Log out
        </button>
      </aside>

      <!-- Main -->
      <main class="content">
        <div class="page-head">
          <a
            class="back"
            href="skill_assessment.html"
            onclick="if(history.length>1){history.back();return false;}"
          >
            <iconify-icon icon="mdi:arrow-left"></iconify-icon>
          </a>
          <h1 class="page-title">Skill Assessment</h1>
        </div>

        <div class="exam-top">
          <a
            href="#"
            class="btn-success"
            onclick="alert('Already applied!');return false;"
          >
            <iconify-icon icon="mdi:plus-circle-outline"></iconify-icon> Apply
            For Test
          </a>
          <div class="exam-meta">
            <span>Time : <strong id="examTime">30 Minutes</strong></span>
            <span>Countdown: <strong id="timer">(00 : 00)</strong></span>
          </div>
        </div>

        <section class="paper">
          <h3 id="topicHead" class="topic">Topic 1: SDLC Phases</h3>

          <ol id="qList" class="q-list"></ol>

          <div class="submit-row">
            <button class="btn-primary" onclick="alert('Submitted! (demo)')">
              Submit
            </button>
          </div>
        </section>
      </main>
    </div>

    <script>
      // Read ?testId=
      const id = new URLSearchParams(location.search).get("testId");

      // Demo bank
      const BANK = {
        t2: {
          time: 30,
          topic: "Topic 1: SDLC Phases",
          questions: [
            {
              q: "Which phase involves gathering requirements from stakeholders?",
              options: [
                "Design",
                "Testing",
                "Requirement Analysis",
                "Deployment",
              ],
            },
            {
              q: "True or False: Coding is done in the Implementation phase of SDLC.",
              options: ["True", "False"],
            },
            {
              q: "What is the last phase in SDLC?",
              options: [
                "Testing",
                "Maintenance",
                "Design",
                "Requirement Analysis",
              ],
            },
          ],
        },
        t1: {
          time: 30,
          topic: "Topic: Programming Basics",
          questions: [
            {
              q: "What is O(1)?",
              options: [
                "Constant time",
                "Linear time",
                "Quadratic time",
                "Log time",
              ],
            },
            {
              q: "Choose the correct syntax to declare a function in JS",
              options: [
                "func Add(){}",
                "function add(){}",
                "def add():",
                "fn add() {}",
              ],
            },
          ],
        },
        t3: {
          time: 30,
          topic: "Topic: SQL Fundamentals",
          questions: [
            {
              q: "Which JOIN returns only matching rows?",
              options: [
                "INNER JOIN",
                "LEFT JOIN",
                "RIGHT JOIN",
                "FULL OUTER JOIN",
              ],
            },
            {
              q: "Count rows per department — which clause?",
              options: ["GROUP BY", "ORDER BY", "HAVING", "DISTINCT"],
            },
          ],
        },
      };

      const data = BANK[id] || BANK.t2;
      document.getElementById("topicHead").textContent = data.topic;
      document.getElementById("examTime").textContent = `${data.time} Minutes`;

      const qList = document.getElementById("qList");
      data.questions.forEach((item, idx) => {
        const li = document.createElement("li");
        li.className = "q";
        li.innerHTML = `
          <p class="qq">${idx + 1}. ${item.q}</p>
          <ul class="opts">
            ${item.options
              .map(
                (opt, i) => `
              <li>
                <label>
                  <input name="q${idx}" type="${
                  item.options.length === 2 ? "radio" : "radio"
                }" value="${i}">
                  ${String.fromCharCode(65 + i)}) ${opt}
                </label>
              </li>
            `
              )
              .join("")}
          </ul>
        `;
        qList.appendChild(li);
      });

      // (Optional) very simple countdown demo (00:59 -> 00:00)
      let sec = 0; // set a real duration if you want
      function tick() {
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        document.getElementById("timer").textContent = `(${m} : ${s})`;
        if (sec > 0) {
          sec--;
          setTimeout(tick, 1000);
        }
      }
      tick();
    </script>
  </body>
</html>
